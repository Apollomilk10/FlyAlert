<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerta de Passagem</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16211C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E4EAE1;
    --paper-deep:#D3DCCF;
    --ink:#16211C;
    --ink-soft:#5A6862;
    --magenta:#B5177E;
    --cyan:#2F7D95;
    --amber:#C97A05;
    --rule:rgba(22,33,28,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    /* malha de carta aeronáutica */
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size:96px 96px;
    color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:24px 20px 64px;
    max-width:760px;margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ink-soft);
  }
  h1{
    font-family:'Saira Condensed',sans-serif;font-weight:700;
    font-size:clamp(34px,10vw,52px);line-height:.92;letter-spacing:-.01em;
    margin:6px 0 28px;text-transform:uppercase;
  }
  h1 em{font-style:normal;color:var(--magenta)}

  .watch{
    border-top:2px solid var(--ink);
    padding:18px 0 26px;
  }
  .route{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-family:'Saira Condensed',sans-serif;font-weight:700;
    font-size:26px;text-transform:uppercase;letter-spacing:.02em;
  }
  .route .leg{color:var(--cyan)}
  .dates{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    margin-top:4px;
  }
  .now{
    display:flex;align-items:flex-end;gap:14px;margin:18px 0 6px;flex-wrap:wrap;
  }
  .price{
    font-family:'Saira Condensed',sans-serif;font-weight:700;
    font-size:clamp(40px,13vw,64px);line-height:.9;font-variant-numeric:tabular-nums;
  }
  .price.low{color:var(--magenta)}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding:4px 8px;border:1px solid currentColor;
    margin-bottom:8px;
  }
  .tag.low{color:var(--magenta)}
  .tag.typical{color:var(--ink-soft)}
  .tag.high{color:var(--amber)}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);line-height:1.7}

  /* corredor: faixa tipica sombreada + linha do preço */
  .corridor{width:100%;height:132px;display:block;margin:16px 0 8px}
  .legend{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);display:flex;gap:16px;flex-wrap:wrap;
  }
  .legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}

  .panel{
    border:2px solid var(--ink);background:var(--paper-deep);
    padding:18px;margin-top:32px;
  }
  .panel p{margin:8px 0 14px;font-size:14px;line-height:1.5}
  button{
    font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:17px;
    text-transform:uppercase;letter-spacing:.06em;
    background:var(--ink);color:var(--paper);border:0;padding:13px 22px;
    cursor:pointer;width:100%;
  }
  button:hover:not(:disabled){background:var(--magenta)}
  button:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}
  button:disabled{background:var(--ink-soft);cursor:default}

  .empty,.error{
    font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.7;
    border-left:3px solid var(--magenta);padding-left:14px;margin:28px 0;
  }
  @media (prefers-reduced-motion:no-preference){
    .watch{animation:rise .5s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  }
</style>
</head>
<body>

<div class="eyebrow">Monitor de tarifas</div>
<h1>Avisa quando<br>ficar <em>barato</em></h1>

<div id="watches"></div>

<div class="panel">
  <div class="eyebrow">Notificações</div>
  <p id="pushStatus">Ative para receber um aviso no celular assim que a tarifa cair.</p>
  <button id="pushBtn">Ativar notificações</button>
</div>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
// ---- Configure aqui ----
const SUPABASE_URL  = 'https://qnxyjzmqubzdkouvzewq.supabase.co';
const SUPABASE_ANON = 'sb_publishable_glj1x8t-y-vGdhozSBW84Q_rLRlkdbk';
const ONESIGNAL_APP_ID = '11593a31-7feb-45b9-aad9-5d1eb46bf1c7';
// ------------------------

const brl = (v, c='BRL') =>
  new Intl.NumberFormat('pt-BR',{style:'currency',currency:c,maximumFractionDigits:0}).format(v);
const dia = d => new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});

async function api(path){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
    headers:{apikey:SUPABASE_ANON, Authorization:`Bearer ${SUPABASE_ANON}`}
  });
  if(!r.ok) throw new Error(`Supabase respondeu ${r.status}`);
  return r.json();
}

// Gráfico: a faixa típica vira um corredor sombreado; o preço é a rota atravessando.
function corridor(checks, low, high){
  const W=680, H=132, P=8;
  const prices = checks.map(c=>Number(c.price));
  const min = Math.min(...prices, low ?? Infinity)*0.97;
  const max = Math.max(...prices, high ?? -Infinity)*1.03;
  const y = v => P + (H-2*P) * (1 - (v-min)/(max-min));
  const x = i => prices.length<2 ? W/2 : (i/(prices.length-1))*W;
  const line = prices.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p).toFixed(1)}`).join(' ');

  const band = (low!=null && high!=null)
    ? `<rect x="0" y="${y(high).toFixed(1)}" width="${W}" height="${(y(low)-y(high)).toFixed(1)}"
         fill="#2F7D95" opacity=".14"/>
       <line x1="0" y1="${y(low).toFixed(1)}" x2="${W}" y2="${y(low).toFixed(1)}"
         stroke="#2F7D95" stroke-width="1" stroke-dasharray="6 4"/>` : '';

  const last = prices.at(-1);
  return `<svg class="corridor" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
            aria-label="Histórico de preços comparado com a faixa normal">
    ${band}
    <path d="${line}" fill="none" stroke="#B5177E" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(prices.length-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="5" fill="#B5177E"/>
  </svg>`;
}

function cardHTML(w, checks){
  const atual = checks.at(-1);
  const nivel = {low:'Barato',typical:'Normal',high:'Caro'}[atual.price_level] ?? '—';
  const cls = atual.price_level ?? 'typical';
  const menor = Math.min(...checks.map(c=>Number(c.price)));

  return `<article class="watch">
    <div class="route">${w.departure_id} <span class="leg">———&gt;</span> ${w.arrival_id}</div>
    <div class="dates">${dia(w.outbound_date)}${w.return_date? ' — '+dia(w.return_date):' · só ida'}
      ${w.target_price? ' · teto '+brl(w.target_price, atual.currency):''}</div>

    <div class="now">
      <span class="price ${cls}">${brl(atual.price, atual.currency)}</span>
      <span class="tag ${cls}">${nivel}</span>
    </div>

    ${checks.length>1 ? corridor(checks, atual.typical_low, atual.typical_high) : ''}
    ${atual.typical_low ? `<div class="legend">
      <span><i style="background:#B5177E"></i>Preço observado</span>
      <span><i style="background:#2F7D95;opacity:.5"></i>Faixa normal ${brl(atual.typical_low, atual.currency)}–${brl(atual.typical_high, atual.currency)}</span>
    </div>` : ''}

    <div class="meta">
      ${atual.airline ?? 'Companhia n/d'} · menor visto ${brl(menor, atual.currency)}
      · atualizado ${new Date(atual.checked_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
    </div>
  </article>`;
}

(async () => {
  const el = document.getElementById('watches');
  try{
    const watches = await api('watches?active=eq.true&select=*&order=outbound_date.asc');
    if(!watches.length){
      el.innerHTML = `<div class="empty">Nenhuma rota sendo monitorada.<br>
        Adicione uma linha na tabela <b>watches</b> no Supabase para começar.</div>`;
      return;
    }
    const cards = [];
    for(const w of watches){
      const checks = await api(`price_checks?watch_id=eq.${w.id}&select=*&order=checked_at.asc&limit=120`);
      cards.push(checks.length
        ? cardHTML(w, checks)
        : `<article class="watch"><div class="route">${w.departure_id} <span class="leg">———&gt;</span> ${w.arrival_id}</div>
           <div class="empty">Ainda sem leituras. A primeira consulta roda no próximo ciclo — ou dispare o workflow na mão pelo GitHub.</div></article>`);
    }
    el.innerHTML = cards.join('');
  }catch(err){
    el.innerHTML = `<div class="error">Não deu pra carregar os preços: ${err.message}.<br>
      Confira SUPABASE_URL e a anon key no topo do index.html.</div>`;
  }
})();

// ---- Push ----
window.OneSignalDeferred = window.OneSignalDeferred || [];
const btn = document.getElementById('pushBtn');
const status = document.getElementById('pushStatus');
let OS = null;

// O listener é anexado já, mesmo antes do SDK carregar.
btn.addEventListener('click', async () => {
  if(!OS){
    status.textContent = 'O serviço de notificação ainda não carregou. Aguarde uns segundos e tente de novo.';
    return;
  }
  btn.disabled = true;
  status.textContent = 'Registrando este aparelho...';
  try{
    if(Notification.permission !== 'granted'){
      await OS.Notifications.requestPermission();
    }
    if(Notification.permission === 'denied'){
      status.textContent = 'Permissão bloqueada. Libere as notificações nas configurações do site, no navegador, e tente de novo.';
      btn.disabled = false;
      return;
    }
    await OS.User.PushSubscription.optIn();

    for(let i=0; i<12 && !OS.User.PushSubscription.id; i++){
      await new Promise(r => setTimeout(r, 500));
    }
    refreshPush();

    if(!OS.User.PushSubscription.optedIn){
      status.textContent = 'O aparelho não completou o registro. Recarregue a página e tente mais uma vez.';
      btn.disabled = false;
    }
  }catch(e){
    status.textContent = `Não foi possível ativar: ${e.message}`;
    btn.disabled = false;
  }
});

function refreshPush(){
  if(!OS) return;
  const sub = OS.User.PushSubscription;
  if(sub.optedIn && sub.id){
    status.textContent = `Notificações ativas neste aparelho (${sub.id.slice(0,8)}).`;
    btn.textContent = 'Ativado';
    btn.disabled = true;
  }
}

OneSignalDeferred.push(async (OneSignal) => {
  try{
    await OneSignal.init({
      appId: ONESIGNAL_APP_ID,
      // O site vive em /FlyAlert/, não na raiz do domínio.
      serviceWorkerPath: 'FlyAlert/OneSignalSDKWorker.js',
      serviceWorkerParam: { scope: '/FlyAlert/' },
      allowLocalhostAsSecureOrigin: true,
    });
    OS = OneSignal;
    refreshPush();
    OneSignal.User.PushSubscription.addEventListener('change', refreshPush);
  }catch(e){
    status.textContent = `Falha ao iniciar o serviço de notificação: ${e.message}`;
  }
});

// O worker do OneSignal ja cuida do escopo /FlyAlert/.
// Um segundo worker aqui competiria por ele, entao fica de fora.
</script>
</body>
</html>
