name: Checar preços

on:
  schedule:
    # Todo dia (UTC) = 06h17 em Brasília (o GitHub costuma atrasar umas horas).
    # Cada alerta ativo gasta 1 busca por dia; o orçamento em check-price.mjs protege a cota.
    - cron: '17 9 * * *'
  push:
    paths: ['.run-now']
  workflow_dispatch:        # botão pra rodar na mão

concurrency:
  group: check-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar preços e alertar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Opcionais (Settings > Variables > Actions): dia em que a cota renova, folga e limite de reserva
          SERPAPI_DIA_RENOVACAO: ${{ vars.SERPAPI_DIA_RENOVACAO }}
          SERPAPI_RESERVA: ${{ vars.SERPAPI_RESERVA }}
          SERPAPI_LIMITE: ${{ vars.SERPAPI_LIMITE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: node scripts/check-price.mjs
