name: Checar preços

on:
  schedule:
    # 3x/dia (UTC) = 22h17, 06h17 e 14h17 em Brasília.
    # 2 rotas x 3 consultas x 31 dias = 186 buscas/mês — cabe nas 250 do free tier.
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:        # botão pra rodar na mão

concurrency:
  group: check-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar preços e alertar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: node scripts/check-price.mjs
