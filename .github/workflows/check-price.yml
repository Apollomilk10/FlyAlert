name: Checar preços

on:
  schedule:
    # 1x/dia (UTC) = 06h17 em Brasília. Cada rota só é consultada conforme a proximidade
    # da viagem (>90 dias: a cada 3 dias; 30-90: a cada 2; <30: todo dia) — ver check-price.mjs.
    - cron: '17 9 * * *'
  workflow_dispatch:        # botão pra rodar na mão
    inputs:
      forcar:
        description: 'Consultar todas as rotas agora, ignorando o intervalo'
        type: boolean
        default: false

concurrency:
  group: check-price
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Consultar preços e alertar
        env:
          FORCAR: ${{ inputs.forcar }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Opcionais (Settings > Variables > Actions): dia em que a cota renova, folga e limite de reserva
          SERPAPI_DIA_RENOVACAO: ${{ vars.SERPAPI_DIA_RENOVACAO }}
          SERPAPI_RESERVA: ${{ vars.SERPAPI_RESERVA }}
          SERPAPI_LIMITE: ${{ vars.SERPAPI_LIMITE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          ONESIGNAL_SUBSCRIPTION_ID: ${{ secrets.ONESIGNAL_SUBSCRIPTION_ID }}
        run: node scripts/check-price.mjs
